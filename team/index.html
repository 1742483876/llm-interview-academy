<style>
body{margin:0;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f7f5;color:#1f2328}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,rgba(47,127,216,.14),rgba(139,92,246,.14))}

.lk label{display:block;margin-top:10px;font-size:13px;color:#6b7280}
