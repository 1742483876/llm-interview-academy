<style>
body{margin:0;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f7f7f5;color:#1f2328}
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,rgba(47,127,216,.14),rgba(139,92,246,.14))}
.lk{width:100%;max-width:360px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:26px 24px;box-shadow:0 10px 40px rgba(0,0,0,.08);text-align:center}
.lk h1{font-size:22px;margin:6px 0 4px}.lk p{color:#6b7280;font-size:13px;margin:0 0 16px}
.lk input[type=password]{width:100%;box-sizing:border-box;font-size:20px;letter-spacing:.3em;text-align:center;padding:10px;border:1px solid #d1d5db;border-radius:12px;outline:none}
.lk input[type=password]:focus{border-color:#2f7fd8;box-shadow:0 0 0 3px rgba(47,127,216,.15)}
.lk button{margin-top:12px;width:100%;padding:11px;border:0;border-radius:12px;background:#1f2328;color:#fff;font-size:15px;font-weight:600}
.lk label{display:block;margin-top:10px;font-size:13px;color:#6b7280}
#msg{min-height:20px;margin-top:10px;font-size:13px;color:#e5484d}
@media (prefers-color-scheme:dark){body{background:#16181d;color:#e8e6e0}.lk{background:#1f2228;border-color:#333842}.lk input[type=password]{background:#16181d;color:#e8e6e0;border-color:#333842}.lk button{background:#e8e6e0;color:#16181d}}
